<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#3b82f6"/>
  <g transform="translate(16, 16)">
    <!-- Clock face -->
    <circle cx="0" cy="0" r="9" fill="white" opacity="0.95"/>
    <circle cx="0" cy="0" r="1.5" fill="#3b82f6"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-4" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="5" y2="0" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Clock markers -->
    <circle cx="0" cy="-7" r="0.8" fill="#3b82f6" opacity="0.6"/>
    <circle cx="7" cy="0" r="0.8" fill="#3b82f6" opacity="0.6"/>
    <circle cx="0" cy="7" r="0.8" fill="#3b82f6" opacity="0.6"/>
    <circle cx="-7" cy="0" r="0.8" fill="#3b82f6" opacity="0.6"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="6" cy="6" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="26" cy="6" r="1.5" fill="white" opacity="0.7"/>
</svg>
