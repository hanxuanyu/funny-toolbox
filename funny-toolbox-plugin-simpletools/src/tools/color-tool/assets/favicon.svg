<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient)" stroke="#fff" stroke-width="4"/>
  
  <!-- 颜色调色板圆形 -->
  <g transform="translate(100, 100)">
    <!-- 红色圆 -->
    <circle cx="0" cy="-50" r="25" fill="#FF0000" opacity="0.9"/>
    <!-- 黄色圆 -->
    <circle cx="43.3" cy="25" r="25" fill="#FFD700" opacity="0.9"/>
    <!-- 青色圆 -->
    <circle cx="-43.3" cy="25" r="25" fill="#00CED1" opacity="0.9"/>
  </g>
  
  <!-- 中心白色圆 -->
  <circle cx="100" cy="100" r="25" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- 定义渐变 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE66D;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
